let cur = 0, mode = "all";
const list = document.getElementById("list"), g = document.getElementById("g");
const q = document.getElementById("q");
let curSec = null;

D.names.forEach((n, i) => {
  const m = n.match(/List\s*(\d+)/);
  const secName = m ? "List " + m[1] : n;
  if (secName !== curSec) {
    curSec = secName;
    const s = document.createElement("div");
    s.className = "sec"; s.textContent = secName;
    list.appendChild(s);
  }
  const d = document.createElement("div");
  d.className = "it" + (i === 0 ? " on" : "");
  d.innerHTML = '<span class="nm">' + n + '</span><span class="n">' + D.data[n].w.length + '</span>';
  d.onclick = () => { q.value = ""; go(i); };
  list.appendChild(d);
});

function card(w, i, total) {
  const split = (w.s || []).map((x, j) => j % 2 === 0 ? '<code>' + x + '</code>' : x).join("");
  return '<div class="card" style="--a:' + w.a + ';--b:' + w.b + '">' +
    '<div class="top"><span class="word">' + w.w + '</span>' +
    (w.p ? '<span class="ph">' + w.p + '</span>' : '') +
    '<span class="idx">' + (i + 1) + '/' + total + '</span></div>' +
    '<p class="cn">' + w.m + '</p>' +
    (split ? '<p class="split">' + split + '</p>' : '') +
    (w.x ? '<p class="gloss">' + w.x + '</p>' : '') +
    (w.h ? '<p class="hook">' + w.h + '</p>' : '') +
    (w.q ? '<p class="say">' + w.q + '</p>' : '') +
    (w.f && w.f.length ? '<p class="fam">' + w.f.map(x => '<span>' + x + '</span>').join("") + '</p>' : '') +
    (w.n ? '<p class="note">' + w.n + '</p>' : '') + '</div>';
}

function render() {
  const n = D.names[cur], d = D.data[n];
  document.querySelectorAll(".it").forEach((e, i) => e.classList.toggle("on", i === cur));
  document.getElementById("h1").textContent = n;
  const nr = d.w.filter(x => x.h).length, nq = d.w.filter(x => x.q).length;
  document.getElementById("sub").textContent =
    "共 " + d.w.length + " 词 · 口诀 " + nr + " 条 · 速记 " + nq + " 条 · 第 " + (cur + 1) + "/" + D.names.length + " 页";
  let html = '<span class="stat">本页出现 ' + d.g.length + ' 个词根 · 标「全册」的是本册其他页也会用到的</span>';
  if (d.g.length) {
    html += '<h2>本页词根串讲</h2>' +
      d.g.map(x => '<span class="r"><b>' + x.r + '</b> · ' + x.ws +
        (x.tot > 1 ? '<em>全册 ' + x.tot + '</em>' : '') + '</span>').join("");
  } else {
    html += '<div class="stat" style="margin-top:4px">本页均为整词记忆，无可拆词根</div>';
  }
  document.getElementById("roots").innerHTML = html;
  g.innerHTML = d.w.map((w, i) => card(w, i, d.w.length)).join("");
  document.body.classList.toggle("hide", mode === "hide");
  const on = document.querySelector(".it.on");
  if (on) on.scrollIntoView({block: "nearest"});
  window.scrollTo(0, 0);
}

function search(kw) {
  kw = kw.trim().toLowerCase();
  if (!kw) { render(); return; }
  const hit = [];
  D.names.forEach(n => D.data[n].w.forEach(w => {
    if (w.w.toLowerCase().includes(kw) || w.m.toLowerCase().includes(kw)) hit.push(w);
  }));
  document.getElementById("h1").textContent = "搜索结果：" + kw;
  document.getElementById("sub").textContent = "共 " + hit.length + " 个匹配（跨 28 页）";
  document.getElementById("roots").innerHTML = "";
  g.innerHTML = hit.map(w => card(w, 0, hit.length)).join("");
  document.body.classList.remove("hide");
}

function go(i) { cur = (i + D.names.length) % D.names.length; render(); }
q.oninput = () => search(q.value);
document.getElementById("bt").onclick = e => { mode = "hide"; q.value = ""; render();
  e.target.classList.add("on"); document.getElementById("ba").classList.remove("on"); };
document.getElementById("ba").onclick = e => { mode = "all"; q.value = ""; render();
  e.target.classList.add("on"); document.getElementById("bt").classList.remove("on"); };
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.addEventListener("keydown", e => {
  if (document.activeElement === q) return;
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "ArrowRight") go(cur + 1);
});
render();
</script>
</body></html>
